<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="threatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#threatGrad)" opacity="0.15" />
  
  <!-- Warning shield container -->
  <path d="M 100 30 L 150 65 L 150 120 C 150 160 100 190 100 190 C 100 190 50 160 50 120 L 50 65 Z" 
        fill="url(#threatGrad)" stroke="#f5576c" stroke-width="2" />
  
  <!-- Warning triangle inside -->
  <g transform="translate(100, 115)">
    <!-- Triangle -->
    <path d="M 0 -30 L 25 20 L -25 20 Z" fill="white" />
    <!-- Exclamation mark dot -->
    <circle cx="0" cy="30" r="4" fill="white" />
  </g>
  
  <!-- Animated warning aura -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#f5576c" stroke-width="1" opacity="0"
          style="animation: glow 2s ease-in-out infinite" />
</svg>

<style>
  @keyframes glow {
    0%, 100% { opacity: 0; stroke-width: 1; }
    50% { opacity: 0.6; stroke-width: 3; }
  }
</style>